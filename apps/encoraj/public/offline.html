<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563eb" />
    <title>Sem conexão — Encoraj</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: #f9fafb; color: #111827; padding: 24px; text-align: center;
      }
      main { max-width: 360px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { font-size: 0.95rem; line-height: 1.5; color: #4b5563; margin: 0 0 24px; }
      button {
        font: inherit; font-weight: 600; color: #fff; background: #2563eb;
        border: 0; border-radius: 8px; padding: 12px 24px; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #030712; color: #f9fafb; }
        p { color: #9ca3af; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sem conexão</h1>
      <p>O Encoraj precisa de internet para registrar e consultar encomendas. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
